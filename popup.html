<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ServiceNow Search</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 12px; width: 320px; }
      .row { display: flex; gap: 8px; }
      input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 10px; }
      button { padding: 10px 12px; border: 0; border-radius: 10px; cursor: pointer; }
      button.primary { background: #2563eb; color: white; }
      button.secondary { background: #f3f4f6; color: #111827; }
      .hint { font-size: 12px; color: #6b7280; margin-top: 8px; line-height: 1.4; }
      .error { font-size: 12px; color: #b91c1c; margin-top: 8px; display: none; }
      .top { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
      a { font-size: 12px; text-decoration: none; color:#2563eb; }
    </style>
  </head>
  <body>
    <div class="top">
      <strong>ServiceNow Search</strong>
      <a href="#" id="openOptions">Options</a>
    </div>

    <div class="row">
      <input id="query" type="text" placeholder="Search (INC0012345, user, keyword...)" autofocus />
      <button id="go" class="primary">Search</button>
    </div>

    <div class="hint">
      Tip: configure your instance domain once in <b>Options</b>.
    </div>
    <div class="error" id="error"></div>

    <script src="popup.js"></script>
  </body>
</html>
